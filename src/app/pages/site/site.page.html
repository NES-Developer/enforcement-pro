<ion-header [translucent]="true">
    <!-- Main content -->
    <ion-router-outlet></ion-router-outlet>

    <!-- Bottom Tab Bar -->
    <ion-toolbar>
        <ion-row>

            <ion-col>
                <ion-tab-button (click)="navigate('/dashboard')">
                    <ion-icon name="home"></ion-icon>
                </ion-tab-button>
            </ion-col>
            <ion-col>
                <ion-tab-button (click)="forceRefresh()">
                    <ion-icon name="refresh"></ion-icon>
                </ion-tab-button>
            </ion-col>
        </ion-row>
    </ion-toolbar>
</ion-header>
  
<ion-content [fullscreen]="true">

    <ion-item>
      <ion-input
        interface="action-sheet"
        [(ngModel)]="searchQuery"
        placeholder="Search"
        (input)="filterSites()"
      ></ion-input>
    </ion-item>

    <!-- Site List -->
    <ion-list *ngIf=" searchQuery == '' ">
        <div>
            <div class="site-load" *ngIf="sites.length<1">
                <img *ngIf="!sitesLoadFailed" src="../assets/loader.gif">
                <ion-label *ngIf="sitesLoadFailed">Unable to load sites. Tap refresh to try again.</ion-label>
              </div>
            <ion-item *ngFor="let site of sites">
                <ion-grid>
                <ion-row>
                    <ion-col size="3">
                        <img [src]="getImageUrl(site.logo)" height="40px" />
                    </ion-col>
                    <ion-col size="6">
                        <ion-label>{{ site.name }}</ion-label>
                    </ion-col>
                    <ion-col size="3">
                        <ion-button (click)="setSite(site.id)" color="dark">Select</ion-button>
                    </ion-col>
                </ion-row>
                </ion-grid>
            </ion-item>
        </div>
        
    </ion-list>
    <!-- Handle the else -->
    <ion-list *ngIf=" searchQuery != '' ">
        <div *ngIf="filteredSites.length > 0">
            <ion-item *ngFor="let site of filteredSites">
            <ion-grid>
                <ion-row>
                <ion-col size="3">
                    <img [src]="getImageUrl(site.logo)" height="40px" />
                </ion-col>
                <ion-col size="6">
                    <ion-label>{{ site.name }}</ion-label>
                </ion-col>
                <ion-col size="3">
                    <!-- <ion-button (click)="setSite({{ site }})" color="dark">Select</ion-button> -->
                    <ion-button (click)="setSite(site.id)" color="dark">Select</ion-button>
                </ion-col>
                </ion-row>
            </ion-grid>
            </ion-item>
        </div>

        <!-- No Results Message -->
        <div *ngIf="filteredSites.length === 0">
            <ion-label>No sites found. Try searching again!</ion-label>
        </div>
    </ion-list>
  
    
  </ion-content>
