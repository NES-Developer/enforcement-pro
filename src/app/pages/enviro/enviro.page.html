

<ion-header [translucent]="true">
    <!-- Main content -->
    <ion-router-outlet></ion-router-outlet>
  
    <app-nav-bar
        [photoCount]="enviro_post.offence_images.length"
        [currentStep]="currentStep">
    </app-nav-bar>
</ion-header>

<ion-content [fullscreen]="true">
  <router-outlet></router-outlet>

  <!-- <ion-header collapse="condense">
      <ion-toolbar>
          <ion-title size="large">FPN</ion-title>
      </ion-toolbar>
  </ion-header> -->
  <ng-container [ngSwitch]="currentStep">
      <app-step1 *ngSwitchCase="1" (next)="nextStep()"></app-step1>
      <app-step2 *ngSwitchCase="2" (previous)="previousStep()" (next)="nextStep()"></app-step2>
      <app-step3 *ngSwitchCase="3" (previous)="previousStep()" (next)="nextStep()"></app-step3>
      <app-step4 *ngSwitchCase="4" (previous)="previousStep()" (next)="nextStep()"></app-step4>
      <app-step5 *ngSwitchCase="5" (previous)="previousStep()" (next)="nextStep()"></app-step5>
      <app-step6 *ngSwitchCase="6" (previous)="previousStep()" (next)="submitForm()"></app-step6>
      <app-step7 *ngSwitchCase="7" (previous)="previousStep()" (next)="submitForm()"></app-step7>
  </ng-container>
</ion-content>


<ion-footer :translucent="true">
  <ion-toolbar>
      <ion-row>
          <ion-col size="6" *ngIf="currentStep === 1">
          </ion-col>
          <ion-col size="6" *ngIf="currentStep > 1 && currentStep < 7">
              <ion-button expand="block" shape="full" (click)="previousStep()">Back</ion-button>
          </ion-col>
          <ion-col size="6" *ngIf="currentStep < 6">
              <ion-button expand="block" shape="full" (click)="nextStep()">Continue</ion-button>
          </ion-col>

          <ion-col size="6" *ngIf="currentStep > 5">
              <ion-button expand="block" shape="full" (click)="saveFPN()">Save</ion-button>
          </ion-col>
          <ion-col size="6" *ngIf="currentStep === 6">
              <ion-button color="primary" expand="block" shape="full" (click)="nextStep()">Notebook Entry</ion-button>
          </ion-col>
          
          <ion-col size="6" *ngIf="currentStep > 5">
              <ion-button color="success" expand="block" shape="full" (click)="submitForm()">Submit</ion-button>
          </ion-col>

      </ion-row>
  </ion-toolbar>
</ion-footer>
