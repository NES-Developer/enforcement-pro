<ion-header [translucent]="true">
    <app-nav-bar
        [photoCount]="enviro_post.offence_images.length"
        [currentStep]="currentStep">
    </app-nav-bar>
</ion-header>

<ion-content [fullscreen]="true">
    <div class="ep-page">
        <div class="ep-page-head">
            <p class="ep-kicker">Evidence</p>
            <h1>Camera</h1>
            <p>{{ enviro_post.offence_images.length }} photo{{ enviro_post.offence_images.length === 1 ? '' : 's' }} attached</p>
        </div>

        <app-evidence-capture></app-evidence-capture>
    </div>
</ion-content>
