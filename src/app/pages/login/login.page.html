<ion-content [fullscreen]="true">
  <div class="ep-login">
    <div class="ep-login__mark">
      <img src="assets/ic_app_logo.png" alt="Enforcement Pro" />
    </div>
    <p class="ep-kicker">Officer access</p>
    <h1 class="ep-login__title">Enforcement Pro</h1>
    <p class="ep-login__sub">Sign in to start your duty.</p>

    <div class="ep-login__card">
      <form (submit)="onSubmit($event)" class="signin-form">
        <div class="form-group">
          <input #idInput type="number" name="id" class="form-control" placeholder="Officer ID" required>
        </div>
        <div class="form-group">
          <input #pinInput name="pin" id="pin-field" type="number" class="form-control" placeholder="PIN" required>
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary">Sign in</button>
        </div>
      </form>
    </div>

    <p class="ep-login__foot">National Enforcement Solutions</p>
  </div>
</ion-content>
