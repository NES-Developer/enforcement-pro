<ion-header [translucent]="true">
  <app-nav-bar></app-nav-bar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ep-page">
    <div class="ep-page-head">
      <p class="ep-kicker">Officer tools</p>
      <h1>Settings</h1>
      <p>Device, site, and session controls.</p>
    </div>

    <section class="ep-section">
      <div class="ep-section__head">
        <p class="ep-kicker">Build</p>
        <h3>App version</h3>
      </div>
      <p class="ep-stat__value">{{ app_version }}</p>
      <ion-button expand="block" (click)="navigate('/dashboard')">Home</ion-button>
    </section>

    <section class="ep-section">
      <div class="ep-section__head">
        <p class="ep-kicker">Location</p>
        <h3>Site and zone</h3>
      </div>

      <ion-select interface="action-sheet" label="Site" label-placement="stacked" fill="outline" multiple="false" [(ngModel)]="site_id" [disabled]="true" (ionChange)="storeAppLog()">
        <ion-select-option *ngFor="let site of sites" [value]="site.id">
          {{ site.name }}
        </ion-select-option>
      </ion-select>

      <ion-select interface="action-sheet" label="Zone" label-placement="stacked" fill="outline" multiple="false" [(ngModel)]="selected_zone" (ionChange)="storeAppLog()">
        <ion-select-option *ngFor="let zone of zones" [value]="zone">
          {{ zone.name }}
        </ion-select-option>
      </ion-select>

      <div class="ep-field-row">
        <ion-input label="Longitude" label-placement="stacked" fill="outline" [disabled]="true" type="text" maxlength="250" [(ngModel)]="position_lng" (ionChange)="storeAppLog()"></ion-input>
        <ion-input label="Latitude" label-placement="stacked" fill="outline" [disabled]="true" type="text" maxlength="250" [(ngModel)]="position_lat" (ionChange)="storeAppLog()"></ion-input>
      </div>

      <p class="ep-ticket__meta">FPN size: {{ getEnviroSizeInBytes() }} bytes</p>
    </section>

    <section class="ep-section">
      <div class="ep-section__head">
        <p class="ep-kicker">Session</p>
        <h3>Actions</h3>
      </div>
      <div class="ep-actions">
        <ion-button expand="block" color="light" (click)="autoLogin()">
          <ion-icon slot="start" name="key-outline"></ion-icon>
          Auto login
        </ion-button>
        <ion-button expand="block" (click)="ping()">Ping</ion-button>
        <ion-button expand="block" color="danger" (click)="cancelEnvio()">Cancel FPN</ion-button>
        <ion-button expand="block" color="danger" (click)="forceCloseApp()">Force close</ion-button>
      </div>
    </section>
  </div>
</ion-content>
