<ion-toolbar class="nav-toolbar">
  <ion-row class="nav-row">
    <ion-col class="nav-col">
      <ion-tab-button class="nav-button" (click)="navigate('/dashboard')">
        <ion-icon name="home"></ion-icon>
      </ion-tab-button>
    </ion-col>
    <ion-col class="nav-col">
      <ion-tab-button class="nav-button" (click)="navigate('/enviro')">
        <ion-icon name="leaf"></ion-icon>
      </ion-tab-button>
    </ion-col>
    <ion-col class="nav-col">
      <ion-tab-button class="nav-button" (click)="navigate('/photo')">
        <ion-row *ngIf="photoCount !== null; else cameraOnly">
          <ion-col size="auto">
            <ion-icon name="camera"></ion-icon>
          </ion-col>
          <ion-col size="auto">
            <ion-label>{{ photoCount }}</ion-label>
          </ion-col>
        </ion-row>
        <ng-template #cameraOnly>
          <ion-icon name="camera"></ion-icon>
        </ng-template>
      </ion-tab-button>
    </ion-col>
    <ion-col class="nav-col">
      <ion-tab-button class="nav-button" (click)="navigate('/queue')">
        <ion-icon name="time"></ion-icon>
      </ion-tab-button>
    </ion-col>
    <ion-col class="nav-col">
      <ion-tab-button class="nav-button" (click)="navigate('/setting')">
        <ion-icon name="person"></ion-icon>
      </ion-tab-button>
    </ion-col>
  </ion-row>
</ion-toolbar>
