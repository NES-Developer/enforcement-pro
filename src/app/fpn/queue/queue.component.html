<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-row>
            <ion-col>
                <ion-button (click)="route('/tabs/fpn')">
                    <ion-icon name="arrow-back"></ion-icon>
                </ion-button>
            </ion-col>
            <ion-col>
                <ion-title>
                    FPN Queue
                </ion-title>
            </ion-col>
            <ion-col>
                <ion-button (click)="route('/tabs/home')">
                    <ion-icon name="home"></ion-icon>
                </ion-button>
            </ion-col>
        </ion-row>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
    <ion-header collapse="condense">
        <ion-toolbar>
            <ion-title size="large">FPN Queue</ion-title>
        </ion-toolbar>
    </ion-header>

    <ion-list [inset]="true">

        <div *ngFor="let enviro_post of enviro_que_addition">

            <ion-item [button]="true">
                <ion-icon color="success" slot="start" name="refresh-circle" size="large" (click)="submitFPN(enviro_post)"></ion-icon>
                <ion-label>Offender Name: {{ enviro_post.first_name }} {{ enviro_post.last_name }}</ion-label>
                <!-- <ion-label>Witness Name: {{ enviro_post.witness_name }}</ion-label> -->
                <ion-icon color="danger" slot="start" name="create" size="large" (click)="editFPN(enviro_post)"></ion-icon>
                
    
                <!-- <div id="domEl" ref={domEl} dangerouslySetInnerHTML={{ __html: data }} /> -->
    
                <ion-note slot="end">
                    <ion-button class="bg-primary" (click)="previewTicket(enviro_post)">
                        Ticket
                    </ion-button>
                    <!-- <img [src]="enviro_post.offence_images[1]" style="height: 80px; border-radius: 5px;" /> -->
                </ion-note>
            </ion-item>


            <div *ngIf="enviro_post.html_bool">

                <ion-item>
                    <ion-button (click)="enviro_post.html_bool = false">x</ion-button>
                    <ion-button (click)="copyTicketToClipboard(enviro_post)">Copy Ticket</ion-button>
                </ion-item>

                <ion-item>
                    <div id="html_ticket" [innerHTML]="enviro_post.html_string">
                    </div>
                </ion-item>
                
            </div>

            <br/>

        </div>
        
    </ion-list>

</ion-content>
