<ion-item>
    <h4>
        Enviro Detail
    </h4>
</ion-item>

<ion-item>
    <ion-label><strong><u>Location Information</u></strong></ion-label>
  </ion-item>

<!-- Offence Location Text -->
<ion-item>
    <ion-label>
        Offence Location *
    </ion-label>
</ion-item>
<ion-content  [ngClass]="{ 'showLeaf': showLeaf, 'hiddenLeaf': !showLeaf }">
    <div id="map-container">
        <div id="map"></div>
      </div>
  </ion-content>
<ion-item> 
    <ion-input #firstInput type="text" (ionChange)="saveEnviroData()" [(ngModel)]="enviro_post.offence_location"></ion-input>
</ion-item>

<ion-item>
    <ion-button (click)="toggleMap();" class="location-search" expand="block">Search Location</ion-button>
</ion-item>

<!-- Offender Reply Select -->
<ion-item>
    <ion-label>
        Type of Land *
    </ion-label>
</ion-item>
<ion-item>
    <ion-select multiple="false" (ionChange)="saveEnviroData()" [(ngModel)]="enviro_post.land_type_id">
        <ion-select-option [value]="1">
            Public
        </ion-select-option>
        <ion-select-option [value]="2">
            Private
        </ion-select-option>
    </ion-select>
</ion-item>

<!-- Town/Ward Select -->
<ion-item>
    <ion-label>
        Town/Ward
    </ion-label>
</ion-item>
<ion-item>
    <ion-input type="text" (ionChange)="saveEnviroData()" [(ngModel)]="enviro_post.town_area"></ion-input>
</ion-item>

<!-- FPN issued on the spot -->
<ion-item>
    <ion-label>FPN issued on the spot</ion-label>  
</ion-item>
<ion-item>
    <ion-select interface="action-sheet" multiple="false" (ionChange)="saveEnviroData()" [(ngModel)]="enviro_post.enviro_issued_onspot">
        <ion-select-option>Yes</ion-select-option>
        <ion-select-option>No</ion-select-option>
    </ion-select>
</ion-item>

<!-- POI Text -->
<ion-item>
    <ion-label>
        POI *
    </ion-label>
</ion-item>
<ion-item>
    <ion-input #firstInput type="text" (ionChange)="saveEnviroData()" [(ngModel)]="enviro_post.poi"></ion-input>
</ion-item>

  <!-- Poi Prefix Select -->
  <ion-item>
    <ion-label>
        POI Prefix
    </ion-label>
</ion-item>
<ion-item>
    <ion-select multiple="false" (ionChange)="saveEnviroData()" [(ngModel)]="enviro_post.poi_prefix_id">
        <ion-select-option *ngFor="let group of poi_prefix" [value]="group.id">
            {{ group.textOnMachine }}
        </ion-select-option>
    </ion-select>
</ion-item>



<ion-item>
</ion-item>
<ion-item>
</ion-item>
<ion-item>
</ion-item>
